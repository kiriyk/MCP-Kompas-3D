[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kompas-local-mcp"
version = "0.3.0"
description = "Minimal local stdio MCP for KOMPAS-3D v21 on Windows"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "pywin32==312; sys_platform == 'win32'"]

[project.scripts]
kompas-local-mcp = "kompas_local_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
